name: CD

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    name: Build & push images to ECR
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          target: api-runner
          build-args: APP_NAME=api
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/edunest-api:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/edunest-api:latest
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/edunest-api:latest
          cache-to: type=inline

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          target: web-runner
          build-args: APP_NAME=web
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/edunest-web:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/edunest-web:latest
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/edunest-web:latest
          cache-to: type=inline

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Authenticate Docker with ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # Pull latest images
            docker pull ${{ secrets.ECR_REGISTRY }}/edunest-api:latest
            docker pull ${{ secrets.ECR_REGISTRY }}/edunest-web:latest

            # Restart services with zero-downtime (compose recreates changed containers)
            cd ~/edunest
            docker compose -f container/docker-compose.prod.yml --env-file .env up -d --no-build

            # Run DB migrations
            docker exec edunest-api sh -c "pnpm exec prisma migrate deploy"

            # Remove dangling images to free disk space
            docker image prune -f
