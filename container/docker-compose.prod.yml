name: edunest

services:
  api:
    container_name: edunest-api
    image: ${ECR_REGISTRY}/edunest-api:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@edunest-postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://edunest-redis:6379
    ports:
      - ${PORT:-8080}:${PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    container_name: edunest-web
    image: ${ECR_REGISTRY}/edunest-web:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
    ports:
      - 3000:3000
    depends_on:
      - api

  postgres:
    container_name: edunest-postgres
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: edunest-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
